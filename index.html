<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>情绪垃圾桶</title>
<style>
:root{--bg:#ffe9f1;--card:#fffafc;--ink:#4a3340;--sub:#b79aa8;--pink:#ee7fa5;--pink2:#fbd3e1;--line:#f3d6e1;--glow:rgba(238,127,165,.4);--hand:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b2028;--card:#392b35;--ink:#f6e6ee;--sub:#a58a99;--pink:#f08cb0;--pink2:#4d3643;--line:#4a3a45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2b2028;--card:#392b35;--ink:#f6e6ee;--sub:#a58a99;--pink:#f08cb0;--pink2:#4d3643;--line:#4a3a45;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{max-width:430px;margin:0 auto;padding:18px 16px 110px}
.hand{font-family:var(--hand)}
.top{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px}
.top h1{margin:0;font-size:34px;line-height:1}
.top small{color:var(--sub);font-size:13px}
.nav{display:flex;gap:8px}
.nav button{height:34px;min-width:34px;padding:0 12px;border-radius:17px;background:var(--pink2);color:var(--pink);font-size:14px}
.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.week{margin-top:14px;color:var(--sub);font-size:12px}
.cell{height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:25px}
.cell b{font-size:15px;font-weight:600}
.cell i{font-style:normal;font-size:13px;height:16px;line-height:16px}
.cell.today{background:var(--pink);color:#fff;box-shadow:0 4px 12px var(--glow)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px}
.card .big{font-size:30px;font-weight:700;color:var(--pink);line-height:1.1}
.card p{margin:4px 0 0;font-size:13px}
.card small{color:var(--sub);font-size:12px}
.focus{display:flex;gap:12px;align-items:center;background:var(--pink2);border-color:transparent;margin-top:12px}
.focus span{font-size:36px}
.focus h3{margin:0;color:var(--pink);font-size:15px}
.focus p{margin:2px 0 0;font-size:13px}
.cta{width:100%;margin-top:14px;height:52px;border-radius:26px;background:var(--pink);color:#fff;font-size:17px;font-weight:600;box-shadow:0 6px 16px var(--glow)}
.bar{height:10px;border-radius:5px;background:var(--pink2);overflow:hidden;margin:10px 0 4px}
.bar div{height:100%;background:var(--pink);border-radius:5px}
.row{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px}
.row .track{flex:1;height:10px;border-radius:5px;background:var(--pink2);overflow:hidden}
.row .track div{height:100%;background:var(--pink);border-radius:5px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs>div{width:100%;max-width:430px;display:flex;justify-content:space-around;align-items:center}
.tabs .t{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--sub);gap:2px}
.tabs .t span{font-size:22px}
.tabs .t.on{color:var(--pink)}
.fab{width:56px;height:56px;border-radius:28px;background:var(--pink);color:#fff;font-size:30px;margin-top:-26px;box-shadow:0 6px 16px var(--glow)}
#flow{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;overflow:hidden}
#flow.open{display:block}
.fin{max-width:430px;height:100%;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;position:relative}
.fhead{display:flex;align-items:center;justify-content:space-between}
.fhead h2{margin:0;font-size:22px}
.x{width:36px;height:36px;border-radius:18px;background:var(--pink2);color:var(--pink);font-size:18px}
.picker{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.pick{border-radius:22px;padding:14px 0 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;color:#5a4a50;transition:transform .15s}
.pick span{font-size:38px;line-height:1.1}
.pick:active,.pick.sel{transform:scale(1.1)}
#s2,#done{display:none;flex:1;flex-direction:column}
#s2.on{display:flex}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding-top:14px}
.note{position:relative;z-index:1;width:min(100%,310px);padding:16px 18px 14px;border-radius:4px;background:var(--paper,#fff3b0);color:#5a4a50;box-shadow:0 8px 20px rgba(120,60,90,.18);transform:rotate(-2deg)}
.note::before{content:"";position:absolute;top:-12px;left:50%;width:84px;height:24px;margin-left:-42px;background:rgba(255,255,255,.55);transform:rotate(2deg)}
.note .lab{font-family:var(--hand);font-size:16px;display:flex;justify-content:space-between}
.note textarea{display:block;width:100%;height:220px;margin-top:6px;border:0;outline:0;resize:none;background:repeating-linear-gradient(transparent 0 33px,rgba(90,60,70,.18) 33px 34px);font-family:var(--hand);font-size:17px;line-height:34px;color:#4a3340;padding:0}
.note textarea::placeholder{color:rgba(90,60,70,.4)}
.note.crumpling{background-image:radial-gradient(circle at 30% 30%,rgba(255,255,255,.8),transparent 40%),repeating-conic-gradient(rgba(0,0,0,.07) 0 15deg,transparent 15deg 30deg)}
.note.crumpling>*,.note.crumpling::before{opacity:0;transition:opacity .15s}
.bottom{width:100%;display:flex;align-items:flex-end;justify-content:space-between;padding:0 4px}
.bottom .sp{width:64px}
#can{position:relative;z-index:2;display:block}
#lid{transform-box:fill-box;transform-origin:left bottom}
.send{width:64px;height:64px;border-radius:32px;background:var(--pink);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px var(--glow)}
.hint{text-align:center;font-size:12px;color:var(--sub);margin:6px 0 0}
.pop{position:absolute;left:50%;font-family:var(--hand);font-size:34px;color:var(--pink);opacity:0;pointer-events:none}
#done{position:absolute;inset:0;background:var(--bg);align-items:center;justify-content:center;text-align:center;gap:6px;padding:20px}
#done.on{display:flex}
#done .cat{font-size:72px}
#done h2{margin:6px 0 0;font-size:34px;font-weight:400}
#done p{color:var(--sub);margin:4px 0 18px}
#done .cta{width:220px}
.cell.has{cursor:pointer}
#done{z-index:5}
#can{transform-origin:50% 100%}
#cf{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#cf i{position:absolute;top:-30px;display:block;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(14px,55vh) rotate(200deg)}100%{transform:translate(-10px,112vh) rotate(400deg)}}
#done>*{position:relative;z-index:1}
#done>#cf{position:absolute;z-index:0}
.mascot svg{width:230px;max-width:72vw;height:auto;display:block;animation:bob 1.7s ease-in-out infinite;transform-origin:50% 90%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
#done h2{font-size:22px;line-height:1.5;max-width:300px}
#dsub{display:none}
@media (prefers-reduced-motion:reduce){#cf i,.mascot svg{animation:none}}
.mi{width:1.25em;height:1.25em;display:inline-block;vertical-align:-.3em}
.cell i{height:20px;line-height:20px}
.cell i .mi{width:19px;height:19px;vertical-align:middle}
.picker{grid-template-columns:repeat(4,1fr);gap:10px}
.pick{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:8px 0;border-radius:18px;font-size:13px;gap:2px}
.pick span{display:block;width:100%;padding:2px 8px 0;font-size:inherit}
.pick .mi{width:100%;height:auto;aspect-ratio:1/1;display:block;vertical-align:baseline}
.pick.sel{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink)}
.lnk{color:var(--pink);font-size:13px;margin-left:10px}
.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.mini button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;font-size:11px;gap:2px}
.mini button.on{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink)}
.mini .mi{width:34px;height:34px;vertical-align:baseline}
.mini em{font-style:normal}
#ball{position:fixed;z-index:1;width:80px;height:80px;display:none;filter:drop-shadow(0 5px 5px rgba(60,30,45,.3));pointer-events:none}
#ball .bi{width:100%;height:100%;clip-path:polygon(48% 0,62% 5%,78% 3%,88% 15%,98% 30%,95% 48%,100% 64%,90% 80%,80% 95%,62% 90%,46% 100%,30% 92%,14% 88%,7% 72%,0 55%,6% 38%,3% 20%,18% 10%,32% 6%);background:linear-gradient(115deg,transparent 30%,rgba(0,0,0,.16) 31%,transparent 35%),linear-gradient(25deg,transparent 47%,rgba(255,255,255,.6) 48%,transparent 52%),linear-gradient(160deg,transparent 58%,rgba(0,0,0,.14) 59%,transparent 64%),linear-gradient(70deg,transparent 18%,rgba(255,255,255,.45) 19%,transparent 24%),conic-gradient(from 20deg at 45% 55%,rgba(0,0,0,.1) 0 40deg,rgba(255,255,255,.35) 40deg 85deg,rgba(0,0,0,.2) 85deg 130deg,rgba(255,255,255,.12) 130deg 200deg,rgba(0,0,0,.08) 200deg 250deg,rgba(255,255,255,.3) 250deg 310deg,rgba(0,0,0,.18) 310deg 360deg),radial-gradient(circle at 32% 28%,rgba(255,255,255,.7),transparent 45%),radial-gradient(circle at 72% 80%,rgba(0,0,0,.3),transparent 58%),var(--paper,#fff3b0)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.quick button{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 0 9px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.quick span{font-size:24px;line-height:1.1}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:80%;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30;text-align:center}
#toast.on{opacity:1}
.inp{display:block;width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;font:inherit;font-size:16px;margin-top:12px;outline:0}
.inp:focus{border-color:var(--pink)}
.inp:disabled{opacity:.6}
.seg{display:flex;background:var(--pink2);border-radius:18px;padding:3px;margin:10px 0 4px}
.seg button{flex:1;height:30px;border-radius:15px;font-size:14px;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--pink);font-weight:600}
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.sw button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
.sw i{width:40px;height:40px;border-radius:20px;display:block;border:3px solid var(--card);box-shadow:0 0 0 2px transparent}
.sw button.on i{box-shadow:0 0 0 2px var(--pink)}
.ana h3{margin:0;font-size:18px;color:var(--pink)}
.ana p{font-size:14px;line-height:1.7;margin:6px 0}
.ana ul{margin:4px 0 0;padding-left:20px;font-size:14px;line-height:1.8}
.ana .warn{background:var(--pink2);border-radius:12px;padding:10px 12px;margin-top:10px}
#sheet{position:fixed;inset:0;z-index:15;display:none;background:rgba(60,30,45,.35)}
#sheet.open{display:block}
.sheetin{position:absolute;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;max-height:78%;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.entry{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:10px}
.entry .eh{display:flex;justify-content:space-between;font-size:13px;color:var(--sub)}
.entry .eh b{color:var(--ink);font-size:15px}
.entry p{margin:8px 0 0;font-size:16px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.entry p.empty{color:var(--sub);font-size:14px}
@media (prefers-reduced-motion:reduce){.pick{transition:none}}
</style>
</head>

<div id="app">
  <div id="home"></div>
  <div id="stats" style="display:none"></div>
</div>

<div class="tabs"><div>
  <button class="t on" id="t1" onclick="tab('home')"><span>📅</span>日历</button>
  <button class="fab" onclick="openFlow()" aria-label="丢一张便签">＋</button>
  <button class="t" id="t2" onclick="tab('stats')"><span>👤</span>我的</button>
</div></div>

<div id="flow"><div class="fin">
  <div class="fhead"><h2 class="hand" id="ftitle">今天心情怎么样？</h2><button class="x" onclick="closeFlow()" aria-label="关闭">✕</button></div>
  <div class="picker" id="picker"></div>

<script>
const $=s=>document.querySelector(s);
const EM_OLD=[
 {e:'😊',n:'开心',c:'#fff3b0',p:'有什么好事？写下来炫耀一下'},
 {e:'😌',n:'平静',c:'#d8f3e6',p:'今天很安静，想记点什么？'},
 {e:'😢',n:'难过',c:'#d6e8ff',p:'哭一下也可以，慢慢说…'},
 {e:'😠',n:'生气',c:'#ffd4d0',p:'谁惹你了？尽情骂，反正会被丢掉'},
 {e:'😣',n:'烦躁',c:'#ffe0c2',p:'什么事一直在烦你？'},
 {e:'😵‍💫',n:'忙碌',c:'#e6dcff',p:'今天都在忙什么？吐个槽'},
 {e:'😰',n:'焦虑',c:'#ffe0f0',p:'在担心什么？写出来会轻一点'},
 {e:'😪',n:'疲惫',c:'#e8e4dc',p:'今天累在哪里？'},
 {e:'🥺',n:'委屈',c:'#ffdbe8',p:'受了什么委屈？这里只有垃圾桶听得到'},
 {e:'😑',n:'无聊',c:'#e3e8ec',p:'无聊到想写点什么？'},
 {e:'🤩',n:'兴奋',c:'#ffe9a8',p:'发生什么啦？快说！'},
 {e:'😶',n:'空空的',c:'#eef0f2',p:'说不清楚也没关系，随便写几个字'}
];
const EM=[
 {n:'开心',c:'#fff3b0',p:'有什么好事？写下来炫耀一下'},
 {n:'酷',c:'#ffe2a8',p:'今天有什么帅气的瞬间？'},
 {n:'幸运',c:'#d9f0b8',p:'遇到什么好运了？记下来沾沾喜气'},
 {n:'平静',c:'#d4f1dd',p:'今天很安静，想记点什么？'},
 {n:'忙碌',c:'#ffd5c0',p:'今天都在忙什么？吐个槽'},
 {n:'悠闲',c:'#d6f2c4',p:'今天做了什么悠闲的事？'},
 {n:'累',c:'#dcdbe8',p:'今天累在哪里？说出来会好一点'},
 {n:'生气',c:'#ffd0d6',p:'谁惹你了？尽情骂，反正会被丢掉'},
 {n:'难过',c:'#d3e6fa',p:'哭一下也可以，慢慢说…'},
 {n:'幸福',c:'#ffe6cf',p:'什么让你觉得幸福？'}
];
EM.forEach((m,i)=>m.e='<svg class="mi" viewBox="0 0 100 100"><use href="#m'+i+'"/></svg>');
const LINES=['谢谢今天也在努力生活的你o(≧v≦)o'];
const MON=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
const K='moodtrash.v1',pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function load(){
  try{const s=localStorage.getItem(K);if(s){const o=JSON.parse(s);for(const k in o.days){const r=o.days[k];if(!Array.isArray(r))o.days[k]=Array.from({length:r.n||1},()=>({e:r.e,t:'',ts:0}))}o.prefs=o.prefs||{theme:0,nick:'',acct:''};if(!o.v){const mp=[0,3,8,7,7,4,4,6,8,5,2,3];for(const k in o.days)o.days[k].forEach(x=>{x.e=mp[x.e]});o.v=2}return o}}catch(e){}
  const days={},t=new Date();
  const ST={0:'今天天气很好，心情也跟着好。',3:'下午喝了杯茶，什么都没想。',8:'有点想家。',7:'地铁上被挤得好烦。',4:'开了一整天会，脑子嗡嗡的。',6:'好想睡觉……'};
  [].forEach(([b,es])=>{const d=new Date(t);d.setDate(t.getDate()-b);days[key(d)]=es.map((e,i)=>({e,t:ST[e]||'',ts:d.getTime()-i*3600000}))});
  return {days,v:2,prefs:{theme:0,nick:'',acct:''}};
}
function save(){data.u=Date.now();try{localStorage.setItem(K,JSON.stringify(data))}catch(e){}syncDb()}
let data=load(),vy=new Date().getFullYear(),vm=new Date().getMonth(),cur=0,busy=false;
function streak(){const d=new Date();if(!data.days[key(d)])d.setDate(d.getDate()-1);let n=0;while(data.days[key(d)]){n++;d.setDate(d.getDate()-1)}return n}
function total(){return Object.values(data.days).reduce((a,r)=>a+r.length,0)}

function renderHome(){
  const now=new Date(),first=new Date(vy,vm,1).getDay(),len=new Date(vy,vm+1,0).getDate(),p=data.prefs;
  let cells='';
  for(let i=0;i<first;i++)cells+='<div class="cell"></div>';
  for(let d=1;d<=len;d++){
    const k=vy+'-'+pad(vm+1)+'-'+pad(d),r=data.days[k];
    const em=r?EM[main(r)].e:'';
    cells+='<div class="cell'+(k===key(now)?' today':'')+(k<=key(now)?' has':'')+'"'+(k<=key(now)?' onclick="showDay(\''+k+'\')"':'')+'><b>'+d+'</b><i>'+em+'</i></div>';
  }
  const pre=now.getFullYear()+'-'+pad(now.getMonth()+1);
  let mc=0,dm=0;for(const k in data.days)if(k.startsWith(pre)){mc+=data.days[k].length;dm++}
  $('#home').innerHTML=
  '<div class="top"><div><h1 class="hand">'+MON[vm]+'</h1><small>'+vy+'　'+(p.acct&&p.nick?'Hi，'+esc(p.nick):'')+'</small></div>'+
  '<div class="nav"><button onclick="mv(-1)" aria-label="上个月">‹</button><button onclick="goToday()">今日</button><button onclick="mv(1)" aria-label="下个月">›</button></div></div>'+
  '<div class="week">'+['日','一','二','三','四','五','六'].map(x=>'<div>'+x+'</div>').join('')+'</div>'+
  '<div class="grid">'+cells+'</div>'+
  '<div class="two"><div class="card"><div class="big">'+dm+'<span style="font-size:18px"> 天</span></div><p>本月记录过</p></div>'+
  '<div class="card"><div class="big">'+mc+'<span style="font-size:18px"> 张</span></div><p>本月丢进垃圾桶</p></div></div>'+
  '<div class="quick"><button onclick="openFlow()"><span>✏️</span>写便签</button><button onclick="openFlow(1)"><span>⚡</span>快速记</button><button onclick="showAll()"><span>🗑️</span>翻垃圾桶</button><button onclick="warm()"><span>💌</span>暖心话</button></div>';
}
function renderStatsOld(){
  const t=total(),fill=t%20,cnt=EM.map(()=>0);
  Object.values(data.days).forEach(r=>r.forEach(x=>cnt[x.e]++));
  const mx=Math.max(1,...cnt);
  $('#stats').innerHTML=
  '<div class="top"><div><h1 class="hand">垃圾桶</h1><small>丢掉的都不会再回来</small></div></div>'+
  '<div class="card" style="margin-top:16px"><div class="big">'+t+'<span style="font-size:18px"> 张</span></div><p>一共丢掉的便签</p>'+
  '<div class="bar"><div style="width:'+fill*5+'%"></div></div><small>再丢 '+(20-fill)+' 张，垃圾桶满了可以清空换新外观</small></div>'+
  '<div class="card" style="margin-top:12px"><b>情绪排行</b>'+
  EM.map((m,i)=>[m,cnt[i]]).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]>0).map(([m,c])=>
    '<div class="row"><span style="width:62px">'+m.e+' '+m.n+'</span><div class="track"><div style="width:'+c/mx*100+'%"></div></div><span>'+c+'</span></div>').join('')+'</div>';
}
function mv(n){vm+=n;if(vm<0){vm=11;vy--}if(vm>11){vm=0;vy++}renderHome()}
function goToday(){const d=new Date();vy=d.getFullYear();vm=d.getMonth();renderHome()}
function tab(w){
  $('#home').parentNode.querySelector('#stats').style.display=w==='stats'?'block':'none';
  $('#home').style.display=w==='home'?'block':'none';
  $('#t1').classList.toggle('on',w==='home');$('#t2').classList.toggle('on',w==='stats');
  if(w==='stats')renderStats();else renderHome();
}

$('#picker').innerHTML=EM.map((m,i)=>'<button class="pick" onclick="choose('+i+')"><span>'+m.e+'</span>'+m.n+'</button>').join('');
let quick=false;
function openFlow(q){quick=!!q;
  resetFlow();$('#flow').classList.add('open');
}
function resetFlow(){
  $('#picker').style.display='grid';$('#s2').classList.remove('on');$('#done').classList.remove('on');
  $('#ftitle').textContent=quick?'快速记一下':'今天心情怎么样？';
  const n=$('#note');n.getAnimations().forEach(a=>a.cancel());$('#lid').getAnimations().forEach(a=>a.cancel());
  n.classList.remove('crumpling');n.style.visibility='visible';const b=$('#ball');b.getAnimations().forEach(a=>a.cancel());b.style.display='none';$('#txt').value='';busy=false;
  document.querySelectorAll('.pick').forEach(b=>b.classList.remove('sel'));
}
function closeFlow(){$('#flow').classList.remove('open');renderHome();if($('#stats').style.display!=='none')renderStats()}
function choose(i){
  cur=i;const m=EM[i];
  if(quick){const k=key(new Date());(data.days[k]=data.days[k]||[]).push({e:i,t:'',ts:Date.now()});save();
    $('#dline').textContent=LINES[Math.floor(Math.random()*LINES.length)];
    $('#dsub').innerHTML=m.e+' '+m.n+'　今天第 '+data.days[k].length+' 张';
    $('#done').classList.add('on');return}
  document.querySelectorAll('.pick')[i].classList.add('sel');
  setTimeout(()=>{
    $('#picker').style.display='none';$('#s2').classList.add('on');
    $('#ftitle').textContent='写给垃圾桶';
    $('#note').style.setProperty('--paper',m.c);
    $('#nlab').innerHTML=m.e+' '+m.n;
    const d=new Date();$('#ndate').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日';
    $('#txt').placeholder=m.p;
  },220);
}
async function throwNote(){
  if(busy)return;busy=true;
  const note=$('#note'),can=$('#can'),lid=$('#lid'),pop=$('#pop'),ball=$('#ball');
  const nr=note.getBoundingClientRect(),cr=can.getBoundingClientRect();
  const dx=cr.left+cr.width/2-(nr.left+nr.width/2),dy=cr.top+cr.height*0.3-(nr.top+nr.height/2);
  note.classList.add('crumpling');
  ball.style.cssText='display:block;opacity:0;left:'+(nr.left+nr.width/2-40)+'px;top:'+(nr.top+nr.height/2-40)+'px';ball.style.setProperty('--paper',EM[cur].c);
  await note.animate([
    {transform:'rotate(-2deg) scale(1)',borderRadius:'4px'},
    {transform:'rotate(6deg) scale(.8,.55)',offset:.5},
    {transform:'rotate(-8deg) scale(.55,.5)'}
  ],{duration:420,fill:'forwards',easing:'ease-in'}).finished;
  note.style.visibility='hidden';ball.style.opacity=1;
  await ball.animate([{transform:'scale(.6) rotate(0)'},{transform:'scale(1.15) rotate(25deg)',offset:.6},{transform:'scale(1) rotate(15deg)'}],{duration:260,fill:'forwards',easing:'ease-out'}).finished;
  lid.animate([{transform:'rotate(0)'},{transform:'rotate(-38deg)'}],{duration:250,fill:'forwards'});
  await ball.animate([
    {transform:'translate(0,0) rotate(15deg) scale(1)'},
    {transform:'translate('+dx*.5+'px,'+(dy*.5-150)+'px) rotate(260deg) scale(.85)',offset:.5},
    {transform:'translate('+dx+'px,'+dy+'px) rotate(500deg) scale(.45)'}
  ],{duration:700,fill:'forwards',easing:'ease-in'}).finished;
  ball.style.display='none';
  lid.animate([{transform:'rotate(-38deg)'},{transform:'rotate(0)'}],{duration:200,fill:'forwards'});
  can.animate([{transform:'translateX(0) rotate(0)'},{transform:'translateX(-8px) rotate(-7deg)'},{transform:'translateX(8px) rotate(7deg)'},{transform:'translateX(-5px) rotate(-4deg)'},{transform:'translateX(4px) rotate(3deg)'},{transform:'translateX(0) rotate(0)'}],{duration:650,easing:'ease-in-out'});
  
  
  try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}
  const k=key(new Date());
  (data.days[k]=data.days[k]||[]).push({e:cur,t:$('#txt').value.trim(),ts:Date.now()});save();
  setTimeout(()=>{
    $('#dline').textContent=LINES[Math.floor(Math.random()*LINES.length)];
    $('#dsub').textContent='今天第 '+data.days[k].length+' 张';
    $('#done').classList.add('on');
  },850);
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function showDayOld(k){
  const r=data.days[k]||[],p=k.split('-'),isT=k===key(new Date());
  $('#sheetin').innerHTML='<div class="top"><div><h1>'+(+p[1])+'月'+(+p[2])+'日</h1><small>共 '+r.length+' 条心情，主要是「'+EM[main(r)].e+' '+EM[main(r)].n+'」</small></div><button class="x" onclick="closeSheet()" aria-label="关闭">✕</button></div>'+
  r.map(x=>{const m=EM[x.e],tm=x.ts?new Date(x.ts):null;
    return '<div class="entry" style="border-left:5px solid '+m.c+'"><div class="eh"><b>'+m.e+' '+m.n+'</b><span>'+(tm?pad(tm.getHours())+':'+pad(tm.getMinutes()):'')+'</span></div><p'+(x.t?'':' class="empty"')+'>'+(x.t?esc(x.t):'（只记了心情，没写内容）')+'</p></div>'}).join('')+
  (isT?'<button class="cta" onclick="closeSheet();openFlow()">＋ 再丢一张</button>':'');
  $('#sheet').classList.add('open');
}
function closeSheet(){$('#sheet').classList.remove('open')}
const WARM=['你已经很努力了，今天先到这里也可以','情绪没有对错，被看见就好','深呼吸三次，再决定下一步','今天的烦恼，丢掉就轻一点','好好吃饭，好好睡觉，你值得','慢慢来，比较快'];
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)}
function warm(){toast(WARM[Math.floor(Math.random()*WARM.length)])}
let ed=null;
function showDay(k){
  const r=data.days[k]||[],p=k.split('-'),today=key(new Date());
  $('#sheetin').innerHTML='<div class="top"><div><h1>'+(+p[1])+'月'+(+p[2])+'日</h1><small>'+(r.length?'共 '+r.length+' 条心情，主要是「'+EM[main(r)].e+' '+EM[main(r)].n+'」':'这天还没有记录')+'</small></div><button class="x" onclick="closeSheet()" aria-label="关闭">✕</button></div>'+
  r.map((x,i)=>{const m=EM[x.e],tm=x.ts&&!x.bf?new Date(x.ts):null;
    return '<div class="entry" style="border-left:5px solid '+m.c+'"><div class="eh"><b>'+m.e+' '+m.n+'</b><span>'+(tm?pad(tm.getHours())+':'+pad(tm.getMinutes()):'')+'<button class="lnk" onclick="editEntry(\''+k+'\','+i+')">编辑</button></span></div><p'+(x.t?'':' class="empty"')+'>'+(x.t?esc(x.t):'（只记了心情，没写内容）')+'</p></div>'}).join('')+
  (k===today?'<button class="cta" onclick="closeSheet();openFlow()">＋ 再丢一张</button>':'<button class="cta" onclick="editEntry(\''+k+'\',-1)">＋ 补记一条</button>');
  $('#sheet').classList.add('open');
}
function editEntry(k,i){const x=i>=0?data.days[k][i]:{e:null,t:''};ed={k,i,e:x.e,t:x.t,del:false};renderEd()}
function renderEd(){
  const tx=$('#etxt');if(tx)ed.t=tx.value;
  const p=ed.k.split('-');
  $('#sheetin').innerHTML='<div class="top"><div><h1>'+(ed.i>=0?'修改心情':'补记心情')+'</h1><small>'+(+p[1])+'月'+(+p[2])+'日</small></div><button class="x" onclick="showDay(\''+ed.k+'\')" aria-label="返回">‹</button></div>'+
  '<div class="mini">'+EM.map((m,i)=>'<button class="'+(ed.e===i?'on':'')+'" onclick="ed.e='+i+';renderEd()">'+m.e+'<em>'+m.n+'</em></button>').join('')+'</div>'+
  '<textarea class="inp" id="etxt" maxlength="500" style="height:130px;padding:12px 14px;resize:none;line-height:1.6" placeholder="想说点什么吗（可以不写）">'+esc(ed.t||'')+'</textarea>'+
  '<button class="cta" onclick="saveEd()">保存</button>'+
  (ed.i>=0?'<button class="cta" style="background:var(--pink2);color:var(--pink);box-shadow:none" onclick="delEd()">'+(ed.del?'再点一次确认删除':'删除这条')+'</button>':'');
}
function refreshAll(){renderHome();if($('#stats').style.display!=='none')renderStats()}
function saveEd(){
  const tx=$('#etxt');ed.t=(tx?tx.value:ed.t||'').trim();
  if(ed.e===null){toast('先选一个情绪');return}
  const k=ed.k,pp=k.split('-');
  if(ed.i>=0){const x=data.days[k][ed.i];x.e=ed.e;x.t=ed.t}
  else{
    const arr=data.days[k]=data.days[k]||[];
    arr.push(k===key(new Date())?{e:ed.e,t:ed.t,ts:Date.now()}:{e:ed.e,t:ed.t,ts:new Date(+pp[0],+pp[1]-1,+pp[2],12,0).getTime()+arr.length*60000,bf:true});

}
function delEd(){
  if(!ed.del){ed.del=true;renderEd();return}

  if(!data.days[k].length)delete data.days[k];
  save();refreshAll();
  if(data.days[k])showDay(k);else closeSheet();

 {n:'燕麦杏',a:'#b58763',bg:'#f6ece2',pink2:'#ecd9c7',line:'#ebdccc',ink:'#4a3a2f',sub:'#ad9784',card:'#fffcf8'},

function applyTheme(){

const GRP={pos:[0,1,2,9],chill:[3,5],act:[7],low:[6,8],busy:[4]};
const TY={
 chill:{t:'慢悠悠型',d:'你的节奏很舒服，平静和悠闲占了大部分，不太容易被外界带着跑。',s:['保持让你舒服的节奏，别被别人催着走','偶尔给生活加点小刺激，比如尝试一件新事','平静的时候也记一笔，以后会很治愈']},
 pos:{t:'乐观开朗型',d:'你的情绪大多轻盈明亮，容易从小事里找到快乐，也能很快恢复平静。',s:['把开心的事写下来，低落时翻出来看看','把好状态分享给身边的人','忙起来的时候，别忽略自己的疲惫']},
 act:{t:'急性子型',d:'你对外界很敏感，生气来得快，说明你在乎事情，也容易被消耗。',s:['情绪上来先停 10 秒，慢慢呼吸 3 次','先把吐槽丢进垃圾桶，再决定要不要沟通','给自己留一段不被打扰的时间']},

 busy:{t:'大忙人型',d:'你的日子被事情塞得很满，常常忙得停不下来，情绪容易被节奏推着走。',s:['每天安排一个什么都不做的 15 分钟','待办按轻重排序，别什么都往身上揽','忙完给自己一个小奖励']},
 mix:{t:'情绪丰富型',d:'你的情绪很丰富，没有被某一种情绪占满，说明你能感受到不同的状态。',s:['继续保持记录，留意情绪的变化规律','开心时记下原因，难过时记下需要什么','定期回看，和过去的自己聊聊']}
};
function analyze(cnt,n){
  if(n<3)return '<p style="color:var(--sub)">再多记几条（至少 3 条），就能看出你的情绪性格啦。</p>';
  const g={};for(const k in GRP)g[k]=GRP[k].reduce((a,i)=>a+cnt[i],0);
  let top='mix',best=0;for(const k in g)if(g[k]>best){best=g[k];top=k}
  if(best/n<0.4)top='mix';
  const ty=TY[top],ti=cnt.indexOf(Math.max(...cnt)),neg=(g.act+g.low)/n;
  return '<h3>'+ty.t+'</h3><p>'+ty.d+'最常出现的是「'+EM[ti].e+' '+EM[ti].n+'」，占 '+Math.round(cnt[ti]/n*100)+'%。</p><b style="font-size:14px">小建议</b><ul>'+ty.s.map(x=>'<li>'+x+'</li>').join('')+'</ul>'+
  (neg>=.6&&n>=6?'<p class="warn">最近偏低落的情绪比较多。如果持续两周以上，或影响了睡眠和生活，建议和信任的人聊聊，或寻求专业帮助。</p>':'')+
  '<small style="color:var(--sub)">根据你的记录自动生成，仅供参考，不是心理诊断。</small>';
}
function mask(a){return a.length>6?a.slice(0,3)+'****'+a.slice(-2):a}
function renderStats(){
  const p=data.prefs,on=!!p.acct,now=new Date(),pre=rp==='m'?now.getFullYear()+'-'+pad(now.getMonth()+1):''+now.getFullYear();
  const cnt=EM.map(()=>0);let n=0;
  for(const k in data.days)if(k.startsWith(pre))data.days[k].forEach(x=>{cnt[x.e]++;n++});
  const rank=EM.map((m,i)=>[m,cnt[i]]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]),mx=rank.length?rank[0][1]:1,medal=['🥇','🥈','🥉'];
  $('#stats').innerHTML=
  '<div class="top"><div><h1 class="hand">我的</h1><small>只属于你的小角落</small></div></div>'+
  '<div class="card" style="margin-top:16px;display:flex;align-items:center;gap:14px"><div style="width:56px;height:56px;border-radius:28px;background:var(--pink2);display:flex;align-items:center;justify-content:center;font-size:30px">🐈</div><div style="flex:1;min-width:0"><b style="font-size:18px">'+(on?esc(p.nick):'未登录')+'</b><p style="margin:2px 0 0">'+(on?esc(mask(p.acct)):'登录后可以设置昵称')+'</p><small>已丢掉 '+total()+' 张</small></div><button class="x" style="width:auto;padding:0 14px;font-size:14px" onclick="showAccount()">'+(on?'设置':'登录')+'</button></div>'+
  '<div class="card" style="margin-top:12px"><b>主题色</b><div class="sw">'+THEMES.map((t,i)=>'<button class="'+(i===p.theme?'on':'')+'" onclick="setTheme('+i+')"><i style="background:'+t.a+'"></i>'+t.n+'</button>').join('')+'</div></div>'+
  '<div class="card" style="margin-top:12px"><b>情绪排行榜</b><div class="seg"><button class="'+(rp==='m'?'on':'')+'" onclick="setRp(\'m\')">本月</button><button class="'+(rp==='y'?'on':'')+'" onclick="setRp(\'y\')">本年</button></div>'+
  (rank.length?rank.map(([m,c],i)=>'<div class="row"><span style="width:92px">'+(i<3?medal[i]:(i+1)+'.')+' '+m.e+' '+m.n+'</span><div class="track"><div style="width:'+c/mx*100+'%"></div></div><span style="width:44px;text-align:right">'+Math.round(c/n*100)+'%</span></div>').join(''):'<p style="color:var(--sub);font-size:14px">这段时间还没有记录。</p>')+'</div>'+
  '<div class="card ana" style="margin-top:12px"><b>你的情绪性格</b><div style="margin-top:6px">'+analyze(cnt,n)+'</div></div>'+'<button class="cta" style="background:var(--pink2);color:var(--pink);box-shadow:none" onclick="clearAll()">清除全部记录</button>';
}

let wx=null,dbd=null,dbt=0,clr=false;

function syncDb(){
  if(!dbd)return;clearTimeout(dbt);
  dbt=setTimeout(()=>{try{dbd.set({json:JSON.stringify(data)}).catch(()=>{})}catch(e){}},300);
}
async function initDb(){
  try{
    if(!window.claude)return;
    const db=await claude.use('db'),us=await claude.use('user');
    if(!db||!us)return;
    const id=await us.id();if(!id)return;
    const ref=db.collection('data/users/'+id).doc('moodtrash');
    const snap=await ref.get();
    let remote=null;
    if(snap.exists){try{remote=JSON.parse(snap.data().json)}catch(e){}}
    if(remote&&(remote.u||0)>(data.u||0)){
      data=remote;
      try{localStorage.setItem(K,JSON.stringify(data))}catch(e){}
      applyTheme();refreshAll();
    }
    dbd=ref;
    if(data.u&&(!remote||data.u>(remote.u||0)))syncDb();
  }catch(e){}
}
